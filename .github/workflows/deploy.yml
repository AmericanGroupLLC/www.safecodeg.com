name: Build & Deploy to HostGator (safecodeg.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build React App & Deploy via SSH/rsync
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # ── 4. Cache ─────────────────────────────────────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 5. Install deps ──────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build ─────────────────────────────────────────────────────────
      - name: Build production bundle
        run: pnpm run build
        env:
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_ID: "agl-scg-website"
          VITE_APP_TITLE: "American Group LLC"
          VITE_FRONTEND_FORGE_API_KEY: ""
          VITE_FRONTEND_FORGE_API_URL: ""
          VITE_OAUTH_PORTAL_URL: ""
          # 6D shared-stage transport (ARCHITECTURE-DIMENSIONS.md §6, §13).
          # The anon key is public-by-design once bundled, but is still
          # sourced from a GitHub Actions secret rather than hardcoded here —
          # same reasoning as the SSH secrets below: keeps it out of this
          # file's git history and lets it be rotated without a code change.
          # Unset secrets resolve to "", which is exactly the safe default:
          # createTransport() returns the null transport and the UI reports
          # "unconfigured" rather than breaking the build.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── 7. Show build output ─────────────────────────────────────────────
      - name: Show build output
        run: ls -la dist/public/ && du -sh dist/public/

      # ── 8. Setup SSH key ─────────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # Also add by hostname
          ssh-keyscan -p 2222 -H ftp.safecodeg.com >> ~/.ssh/known_hosts 2>/dev/null

      # ── 9. Deploy via rsync over SSH ─────────────────────────────────────
      - name: Deploy to HostGator via rsync
        run: |
          # HostGator shared hosting answers SSH on 2222, not 22 — every run since
          # 2026-09-06 died with "Connection closed by <host> port 22". No --delete:
          # the live tree holds policy pages (e.g. policy/*/privacy.html) that older
          # store listings already point at and that this repo only now mirrors.
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 2222" \
            dist/public/ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/public_html/

      # ── 10. Verify ───────────────────────────────────────────────────────
      - name: Verify site is live
        run: |
          sleep 5
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://safecodeg.com || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✅ safecodeg.com is live!"
          else
            echo "⚠️  Status $HTTP_STATUS — check DNS or SSH deploy logs above"
          fi

      # ── 11. Summary ──────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment complete!"
          echo "🌐 https://safecodeg.com"
          echo "🔒 HTTPS enforced via .htaccess"
          echo "📦 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
