name: Build & Deploy to HostGator (safecodeg.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build React App & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # ── 4. Cache ─────────────────────────────────────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 5. Install deps ──────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build ─────────────────────────────────────────────────────────
      - name: Build production bundle
        run: pnpm run build
        env:
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_ID: "agl-scg-website"
          VITE_APP_TITLE: "American Group LLC"
          VITE_FRONTEND_FORGE_API_KEY: ""
          VITE_FRONTEND_FORGE_API_URL: ""
          VITE_OAUTH_PORTAL_URL: ""

      # ── 7. Show build output ─────────────────────────────────────────────
      - name: Show build output
        run: ls -la dist/public/

      # ── 8. Deploy via FTP to HostGator ───────────────────────────────────
      # Notes:
      # - HostGator home dir is /home2/safecode (seen in cPanel as /home2/safecode)
      # - FTP account home is already scoped to public_html
      # - Using server-dir: public_html/ (relative to FTP home /home2/safecode)
      # - dangerous-clean-slate: true removes old WordPress files first
      - name: Deploy to HostGator via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/public/
          # Relative to the FTP account's home (/home2/safecode)
          server-dir: public_html/
          # Clean slate: removes old WordPress files, deploys fresh React site
          dangerous-clean-slate: true
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # ── 9. Verify ────────────────────────────────────────────────────────
      - name: Verify site is live
        run: |
          sleep 5
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://safecodeg.com || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✅ safecodeg.com is live!"
          else
            echo "⚠️  Status $HTTP_STATUS — DNS may still be propagating, check in 5 mins"
          fi

      # ── 10. Summary ──────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment complete!"
          echo "🌐 https://safecodeg.com"
          echo "🔒 HTTPS enforced via .htaccess"
          echo "📦 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
