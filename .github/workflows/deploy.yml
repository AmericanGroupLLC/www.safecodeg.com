name: Build & Deploy to HostGator (safecodeg.com)

# Triggers on every push to main branch
on:
  push:
    branches:
      - main
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build React App & Deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. Install pnpm ───────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # ── 4. Cache pnpm store ───────────────────────────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 5. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build production bundle ────────────────────────────────────────
      - name: Build production bundle
        run: pnpm run build
        env:
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_ID: "agl-scg-website"
          VITE_APP_TITLE: "American Group LLC"
          VITE_FRONTEND_FORGE_API_KEY: ""
          VITE_FRONTEND_FORGE_API_URL: ""
          VITE_OAUTH_PORTAL_URL: ""

      # ── 7. List build output (debug) ──────────────────────────────────────
      - name: Show build output
        run: ls -la dist/public/ && echo "Build size:" && du -sh dist/public/

      # ── 8. Deploy to HostGator via FTPS (Explicit FTP over TLS) ──────────
      - name: Deploy to HostGator via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # HostGator FTP server
          server: ${{ secrets.FTP_SERVER }}

          # HostGator FTP username
          username: ${{ secrets.FTP_USERNAME }}

          # HostGator FTP password
          password: ${{ secrets.FTP_PASSWORD }}

          # Port 21 with explicit FTPS (FTP + TLS encryption)
          port: 21
          protocol: ftps

          # Upload the built React app
          local-dir: ./dist/public/

          # Deploy to the web root on HostGator
          server-dir: /public_html/

          # Keep existing files not in build (e.g. other domains, logs)
          dangerous-clean-slate: false

          # Log level for debugging
          log-level: verbose

          # Exclude source/config files from upload
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # ── 9. Verify deployment ──────────────────────────────────────────────
      - name: Verify site is live
        run: |
          sleep 5
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://safecodeg.com || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✅ safecodeg.com is responding!"
          else
            echo "⚠️  Site returned status $HTTP_STATUS — DNS may still be propagating"
          fi

      # ── 10. Summary ───────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment complete!"
          echo "🌐 Live at: https://safecodeg.com"
          echo "🔒 HTTPS enforced via .htaccess"
          echo "📦 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
