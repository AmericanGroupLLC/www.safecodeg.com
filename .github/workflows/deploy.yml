name: Build & Deploy to HostGator (safecodeg.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build React App & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # ── 4. Cache ─────────────────────────────────────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 5. Install deps ──────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build ─────────────────────────────────────────────────────────
      - name: Build production bundle
        run: pnpm run build
        env:
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_ID: "agl-scg-website"
          VITE_APP_TITLE: "American Group LLC"
          VITE_FRONTEND_FORGE_API_KEY: ""
          VITE_FRONTEND_FORGE_API_URL: ""
          VITE_OAUTH_PORTAL_URL: ""

      # ── 7. Show build output ─────────────────────────────────────────────
      - name: Show build output
        run: ls -la dist/public/

      # ── 8. Deploy via FTP (plain FTP — HostGator standard) ───────────────
      # Fix for "421 Home directory not available":
      # Use plain FTP protocol (not FTPS) and set server-dir to /
      # HostGator FTP home dir IS public_html for this account type
      - name: Deploy to HostGator via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # Use plain ftp — HostGator shared hosting works best with this
          protocol: ftp
          local-dir: ./dist/public/
          # Use / — the FTP account's home dir IS already public_html
          server-dir: /
          dangerous-clean-slate: false
          log-level: verbose
          # Exclude hidden/source files
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # ── 9. Summary ───────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment complete!"
          echo "🌐 https://safecodeg.com"
          echo "🔒 HTTPS enforced via .htaccess"
          echo "📦 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
